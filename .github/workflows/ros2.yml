name: ROS 2 Test and Lint

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  humble:
    runs-on: ubuntu-22.04
    container: ros:humble-ros-base
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          path: src/value_iteration_explorationer
      - name: Install dependencies
        shell: bash
        run: |
          apt-get update
          rosdep update
          rosdep install --from-paths src --ignore-src --rosdistro humble -y
      - name: Build
        shell: bash
        run: |
          source /opt/ros/humble/setup.bash
          colcon build --packages-select value_iteration_explorationer --event-handlers console_direct+ --cmake-args -DCMAKE_BUILD_TYPE=Release
      - name: Test and lint
        shell: bash
        run: |
          source /opt/ros/humble/setup.bash
          source install/setup.bash
          colcon test --packages-select value_iteration_explorationer --event-handlers console_direct+ --return-code-on-test-failure
          colcon test-result --verbose
      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v7.0.1
        with:
          name: humble-test-results
          path: build/value_iteration_explorationer/test_results
